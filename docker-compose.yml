name: astrolura-ai

services:
  # ========================================
  # Milvus Vector Database
  # ========================================
  milvus:
    container_name: astrolura-ai
    image: milvusdb/milvus:v2.5.4
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_USE_EMBED: "true"
      ETCD_DATA_DIR: "/var/lib/milvus/etcd"
      COMMON_STORAGETYPE: local
    volumes:
      - milvus_data:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    ports:
      - "19531:19530"  # gRPC - Python backend buradan bağlanacak
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 8G

# ========================================
# Volumes
# ========================================
volumes:
  milvus_data:
    driver: local
